# Schema defined in agent_schema.py
# https://github.com/MoonshotAI/kimi-code
identity = "kimi.moonshot.cn"
name = "Kimi Code"
short_name = "kimi"
url = "https://github.com/MoonshotAI/kimi-code"
protocol = "acp"
author_name = "Moonshot AI"
author_url = "https://www.kimi.com/"
publisher_name = "SuperQode Team"
publisher_url = "https://github.com/your-org/superqode"
type = "coding"
description = "Moonshot AI's first-party open-source coding agent with a native ACP server."
tags = ["moonshot-ai", "kimi", "open-source", "official-acp"]
run_command."*" = "kimi acp"

help = '''
# Kimi Code

Kimi Code is Moonshot AI's first-party terminal coding agent.

## Features

- **Chinese Language Support**: Native support for Chinese developers
- **Terminal Operations**: Execute and manage terminal commands
- **Code Development**: Assist with software development tasks
- **ACP Integration**: Full Agent Client Protocol support

## Setup Instructions

Launch `kimi` once and complete `/login`. SuperQode then starts its official
ACP server with `kimi acp`.

## Installation

Install the current Kimi Code release:
```bash
curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
```

---

**Website**: https://code.kimi.com/
**GitHub**: https://github.com/MoonshotAI/kimi-code
'''

[actions."*".install]
command = "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash"
description = "Install Kimi Code"

[actions."*".upgrade]
command = "kimi update"
description = "Upgrade Kimi Code"
